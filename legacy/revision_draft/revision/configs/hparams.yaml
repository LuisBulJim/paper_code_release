# Training hyperparameters passed verbatim to ultralytics YOLO.train() for EVERY run
# (Direct Transfer, Sequential Transfer fine-tuning and TrashCan). Table 2 of the manuscript
# is generated from this file. The run seed and the data yaml are added by train_kfold.py.
epochs: 50
patience: 10
imgsz: 640
batch: 16
optimizer: SGD
lr0: 0.01
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: false
mosaic: 1.0
close_mosaic: 10
fliplr: 0.5
flipud: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
translate: 0.1
scale: 0.5
degrees: 0.0
freeze: null
amp: true
deterministic: true
workers: 8
pretrained: true
