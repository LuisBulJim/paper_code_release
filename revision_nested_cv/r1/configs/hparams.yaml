# Training hyperparameters passed verbatim to ultralytics YOLO.train(). Values copied from out/runs/*/args.yaml
# of revision_nested_cv (identical in the 90 nested-CV runs apart from name, data, model and seed), so the TrashCan
# retraining uses exactly the LIACI recipe. patience 100 > epochs 50: no early stopping, best.pt = best val fitness.
epochs: 50
patience: 100
imgsz: 640
batch: 16
optimizer: SGD
lr0: 0.01
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: false
mosaic: 1.0
close_mosaic: 10
fliplr: 0.5
flipud: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
translate: 0.1
scale: 0.5
degrees: 0.0
freeze: null
amp: true
deterministic: true
workers: 4
pretrained: true
